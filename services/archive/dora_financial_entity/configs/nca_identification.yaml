# ==============================================================================
# REGISTER OF INFORMATION SUBMISSION
# ==============================================================================
register_of_information:
  # Reference date for first submission
  # All contractual arrangements in place as of this date must be reported
  reference_date: "2025-03-31"

  # Submission details
  submission:
    platform: null  # e.g., "BaFin MVP Portal", "CSSF eDesk", "CBI ONR"
    format: "CSV"  # Per ITS - plain CSV format
    encoding: "UTF-8"

    # Submission deadlines by Member State
    # IMPORTANT: These are NCA-specific deadlines for first submission
    deadline: null  # e.g., "2025-04-11" for Germany

  # Templates required (DPM 4.0 naming)
  templates:
    - template_id: "B_01.01"
      name: "Entity Identification"
      required: true
    - template_id: "B_02.01"
      name: "Contractual Arrangement"
      required: true
    - template_id: "B_02.02"
      name: "Entities Using ICT Services"
      required: true
    - template_id: "B_02.03"
      name: "Intra-group Linkages"
      required: false  # Only if applicable
    - template_id: "B_03.01"
      name: "ICT Service Provider ID"
      required: true
    - template_id: "B_03.02"
      name: "Direct Providers"
      required: true
    - template_id: "B_03.03"
      name: "Intra-group Providers"
      required: false
    - template_id: "B_04.01"
      name: "Entity Making Use"
      required: true
    - template_id: "B_05.01"
      name: "ICT Services"
      required: true
    - template_id: "B_05.02"
      name: "ICT Service Chain"
      required: true
    - template_id: "B_05.03"
      name: "Service Chain Details"
      required: true
    - template_id: "B_06.01"
      name: "Functions"
      required: true
    - template_id: "B_07.01"
      name: "Assessments"
      required: true
    - template_id: "B_08.01"
      name: "Costs"
      required: true
    - template_id: "B_99.01"
      name: "Definitions"
      required: true

# ==============================================================================
# INCIDENT REPORTING SUBMISSION
# ==============================================================================
incident_reporting:
  # Reporting channel
  platform: null  # e.g., "BaFin MVP Portal", "CBI ONR"
  backup_method: "email"  # If technical impossibility
  backup_email: null

  # Reporting timelines (CDR 2025/301)
  timelines:
    initial_notification:
      # TWO conditions, whichever comes FIRST:
      condition_1: "4 hours after classification as MAJOR"
      condition_2: "24 hours after initial detection"
      logic: "WHICHEVER IS EARLIER"

    intermediate_report:
      deadline: "72 hours after initial notification"

    final_report:
      deadline: "1 month after resolution"

  # Weekend/Holiday extension (CDR 2025/301 Art. 4)
  weekend_extension:
    applies: true
    extension: "until noon of next working day"
    applicable_entities: "certain financial entities per CDR 2025/301 Art. 4"

  # Incident upgrade procedure
  upgrade_procedure:
    trigger: "Incident initially not major, later becomes major"
    deadline: "4 hours from upgrade classification"
    note: "24h from detection no longer constraining after upgrade"

