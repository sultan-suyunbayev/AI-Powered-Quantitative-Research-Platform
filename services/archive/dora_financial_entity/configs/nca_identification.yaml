# ==============================================================================
# DORA NCA (National Competent Authority) Identification Configuration
# ==============================================================================
#
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  WARNING: THIS MODULE IS FOR FINANCIAL ENTITY (FE) CLIENTS ONLY              ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  This platform is an ICT Provider / Software Provider (DORA Art. 30),        ║
# ║  NOT a Financial Entity (DORA Art. 2).                                       ║
# ║                                                                               ║
# ║  NCA reporting obligations (ROI, incidents) apply to Financial Entities.     ║
# ║  As an ICT Provider, we support FE clients with their NCA submissions.       ║
# ║                                                                               ║
# ║  DO NOT use this to configure platform's own NCA relationship.               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# DORA Regulation (EU) 2022/2554 - NCA Identification and Reporting Channels
#
# Identifies the appropriate National Competent Authority (NCA) for FE clients:
#   - Register of Information submission (Article 28)
#   - Major incident reporting (Article 19)
#   - TLPT designation (Article 26)
#
# References:
#   - Article 19: https://www.digital-operational-resilience-act.com/Article_19.html
#   - Article 28: https://www.digital-operational-resilience-act.com/Article_28.html
#
# ==============================================================================

# ==============================================================================
# NCA IDENTIFICATION PROCESS
# ==============================================================================
nca_identification:
  # Step 1: Determine Member State of authorization
  authorization_member_state: null  # ISO 3166-1 alpha-2 (e.g., "DE", "FR", "NL", "IE", "LU")

  # Step 2: Entity type determines NCA
  # Different NCAs may supervise different entity types in same Member State
  entity_type: ""  # REQUIRED: Client's entity type from entity_classification.yaml

  # Step 3: Identified NCA
  primary_nca:
    name: null  # e.g., "BaFin", "AMF", "AFM", "CBI", "CSSF"
    full_name: null  # Full official name
    website: null
    country: null

  # Step 4: If multiple supervisors, identify single NCA for incident reporting
  # Per Article 19(1): Member States designate single NCA if multiple
  designated_incident_nca: null  # May be same as primary_nca

