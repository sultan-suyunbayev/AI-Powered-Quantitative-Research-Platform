# ==============================================================================
# DORA Proportionality Assessment Configuration
# ==============================================================================
#
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  WARNING: THIS MODULE IS FOR FINANCIAL ENTITY (FE) CLIENTS ONLY              ║
# ╠══════════════════════════════════════════════════════════════════════════════╣
# ║  This platform is an ICT Provider / Software Provider (DORA Art. 30),        ║
# ║  NOT a Financial Entity (DORA Art. 2).                                       ║
# ║                                                                               ║
# ║  Proportionality assessment (Art. 4, 16) applies to Financial Entities.      ║
# ║  As an ICT Provider, we do not need to classify ourselves under Art. 16.     ║
# ║                                                                               ║
# ║  DO NOT use this to assess the platform itself.                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# DORA Regulation (EU) 2022/2554 - Proportionality Assessment (Articles 4, 16)
#
# This configuration stores the results of the proportionality assessment
# for FINANCIAL ENTITY clients and defines how DORA requirements should be
# implemented proportionately based on their size and risk profile.
#
# References:
#   - Article 4 (Proportionality): https://www.digital-operational-resilience-act.com/Article_4.html
#   - Article 16 (Simplified Framework): https://www.digital-operational-resilience-act.com/Article_16.html
#   - EU SME Definition: https://ec.europa.eu/growth/smes/sme-definition_en
#
# ==============================================================================

# ==============================================================================
# ASSESSMENT OVERVIEW
# ==============================================================================
assessment:
  # Assessment identification
  assessment_id: null  # Generated by assessment module
  assessment_date: null  # Date assessment was performed

  # Assessment status
  status: "draft"  # "draft", "pending_review", "approved", "expired"
  valid_until: null  # Assessment should be reviewed at least annually

  # Assessor information
  assessed_by: null
  department: null

# ==============================================================================
# ENTITY SIZE CLASSIFICATION (EU Recommendation 2003/361)
# ==============================================================================
#
# IMPORTANT: Definition of microenterprise uses OR, not AND, for turnover/balance:
#   Microenterprise = <10 employees AND (<€2M turnover OR <€2M balance sheet)
#
size_classification:
  # Current metrics (from entity_classification.yaml)
  employee_count: null
  annual_turnover_eur: null
  balance_sheet_eur: null

  # Calculated classification
  is_microenterprise: null  # <10 employees AND (<€2M turnover OR <€2M balance sheet)
  is_small_enterprise: null  # <50 employees AND (<€10M turnover OR <€10M balance sheet)
  is_medium_enterprise: null  # <250 employees AND (<€50M turnover OR <€43M balance sheet)
  is_large_enterprise: null  # Above medium thresholds

  # Size category
  size_category: null  # "microenterprise", "small", "medium", "large"

# ==============================================================================
# APPLICABLE REGIME DETERMINATION
# ==============================================================================
applicable_regime:
  # Determined regime
  # Options: "full", "simplified", "microenterprise"
  regime: null

  # Qualification basis
  qualification_basis: null  # e.g., "Article 16(1)(a)", "microenterprise status"

  # Detailed rationale
  rationale: null

# ==============================================================================
# ARTICLE 16 SIMPLIFIED FRAMEWORK ASSESSMENT
# ==============================================================================
simplified_framework_assessment:
  # Does entity qualify for simplified framework (Article 16)?
  qualifies: null

  # Article 16(1)(a) - Small and non-interconnected investment firm
  small_non_interconnected:
    applicable: false
    # IFR Article 12 criteria
    aum_below_threshold: false  # AUM < €1.2 billion
    client_assets_below_threshold: false  # Client assets < €50 million
    gross_revenue_below_threshold: false  # Gross revenue < €30 million
    trading_on_own_account: false  # If yes, check additional criteria
    evidence: ""

  # Article 16(1)(b) - PSD2 exempted payment institution
  psd2_exempted:
    applicable: false
    psd2_article_32_1_exemption: false
    member_state_exemption_reference: ""

  # Article 16(1)(c) - CRD exempted institution
  crd_exempted:
    applicable: false
    crd_article_2_5_exemption: false
    member_state_decision: ""

  # Article 16(1)(d) - EMD2 exempted e-money institution
  emd2_exempted:
    applicable: false
    emd2_article_9_waiver: false
    waiver_conditions: ""

  # Article 16(1)(e) - Small IORP
  small_iorp:
    applicable: false
    member_state: ""
    qualification_criteria: ""

# ==============================================================================
# MICROENTERPRISE EXEMPTIONS
# ==============================================================================
#
# Microenterprises have partial exemptions from certain DORA requirements.
# These apply even if not qualifying for Article 16 simplified framework.
#
microenterprise_exemptions:
  # Does entity qualify as microenterprise?
  is_microenterprise: null

  # Applicable exemptions
  exemptions:
    # Article 28(2) - No third-party ICT risk strategy required
    no_tpp_strategy:
      applies: null
      article: "Article 28(2)"
      description: "No requirement to adopt and regularly review a strategy on ICT third-party risk"
      affected_requirements:
        - "Third-party ICT risk strategy development"
        - "Annual strategy review"

    # Article 6(6) - Simplified ICT risk management
    simplified_risk_management:
      applies: null
      article: "Article 6(6)"
      description: "ICT risk management framework may be simpler and proportionate"
      affected_requirements:
        - "ICT risk management framework complexity"
        - "Digital resilience strategy detail level"

    # CDR 2024/1772 Article 11(3) - No recurring incident assessment
    no_recurring_incidents:
      applies: null
      article: "CDR 2024/1772 Article 11(3)"
      description: "No requirement to assess recurring ICT incidents"
      affected_requirements:
        - "Recurring incident analysis"
        - "Pattern identification for similar incidents"

    # Article 5(4) - No mandatory management body training
    no_training_requirement:
      applies: null
      article: "Article 5(4)"
      description: "No mandatory ICT training for management body"
      affected_requirements:
        - "Management body ICT skills training"
        - "Training documentation"

# ==============================================================================
# PROPORTIONALITY FACTORS (Article 4)
# ==============================================================================
#
# Even within a determined regime, requirements should be implemented
# proportionately considering these factors.
#
proportionality_factors:
  # Size
  size:
    factor: "size"
    assessment: null  # "small", "medium", "large"
    impact_on_implementation: ""

  # Risk profile
  risk_profile:
    factor: "risk_profile"
    overall_level: null  # "low", "medium", "high"
    ict_dependency: null  # How dependent is business on ICT?
    third_party_dependency: null  # Concentration risk
    impact_on_implementation: ""

  # Nature
  nature:
    factor: "nature"
    entity_type: null
    business_model: null
    impact_on_implementation: ""

  # Scale
  scale:
    factor: "scale"
    geographic_scope: null  # "single_country", "multi_country", "global"
    number_of_member_states: null
    cross_border_services: null
    impact_on_implementation: ""

  # Complexity
  complexity:
    factor: "complexity"
    operational_complexity: null  # "low", "medium", "high"
    ict_architecture_complexity: null
    number_of_third_party_providers: null
    impact_on_implementation: ""

# ==============================================================================
# REQUIREMENTS CATEGORIZATION
# ==============================================================================
requirements_categorization:
  # Requirements that fully apply
  full_requirements:
    - ""  # Populated by assessment

  # Requirements that apply in simplified form
  simplified_requirements:
    - ""

  # Requirements that are exempted
  exempted_requirements:
    - ""

# ==============================================================================
# RECOMMENDED ACTIONS
# ==============================================================================
recommended_actions:
  immediate:
    - "Complete entity classification in entity_classification.yaml"
    - "Document supporting evidence"
    - "Seek legal review of classification"

  short_term:
    - "Prepare Register of Information for submission"
    - "Implement incident reporting capability"

  ongoing:
    - "Monitor size metrics for regime changes"
    - "Annual reassessment of proportionality"

# ==============================================================================
# REVIEW AND APPROVAL
# ==============================================================================
review:
  # Legal review
  legal_review:
    required: true
    completed: false
    reviewer: null
    review_date: null
    comments: ""

  # Management approval
  management_approval:
    required: true
    approved: false
    approver: null
    approval_date: null
    comments: ""

  # NCA notification (if required)
  nca_notification:
    required: false  # Usually not required unless queried
    submitted: false
    submission_date: null
    nca_response: null

# ==============================================================================
# CHANGE LOG
# ==============================================================================
change_log:
  - version: "1.0"
    date: null
    author: null
    changes: "Initial assessment"

# ==============================================================================
# CONFIGURATION METADATA
# ==============================================================================
metadata:
  version: "1.0"
  last_updated: null
  updated_by: null
  next_review_date: null  # Should be at least annually
  notes: ""
