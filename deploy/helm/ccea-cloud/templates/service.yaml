{{- if .Values.controlPlane.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ccea-cloud.fullname" . }}-control-plane
  labels:
    {{- include "ccea-cloud.controlPlane.labels" . | nindent 4 }}
  {{- with .Values.controlPlane.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - port: {{ .Values.controlPlane.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "ccea-cloud.controlPlane.selectorLabels" . | nindent 4 }}
{{- end }}
---
{{- if .Values.telemetryIngester.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ccea-cloud.fullname" . }}-telemetry
  labels:
    {{- include "ccea-cloud.telemetry.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ccea-cloud.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-ingester
{{- end }}
