{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ccea-cloud.fullname" . }}-control-plane
  labels:
    {{- include "ccea-cloud.controlPlane.labels" . | nindent 4 }}
spec:
  {{- if not .Values.controlPlane.autoscaling.enabled }}
  replicas: {{ .Values.controlPlane.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ccea-cloud.controlPlane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "ccea-cloud.controlPlane.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ccea-cloud.serviceAccountName" . }}
      securityContext:
        {{- include "ccea-cloud.podSecurityContext" . | nindent 8 }}
      containers:
        - name: control-plane
          securityContext:
            {{- include "ccea-cloud.containerSecurityContext" . | nindent 12 }}
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            {{- include "ccea-cloud.commonEnv" . | nindent 12 }}
            - name: CCEA_COMPONENT
              value: "control-plane"
            - name: CCEA_BIND_HOST
              value: "0.0.0.0"
            - name: CCEA_BIND_PORT
              value: "8000"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" (include "ccea-cloud.fullname" .)) }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey | default "password" }}
            - name: DATABASE_URL
              value: {{ include "ccea-cloud.databaseUrl" . | quote }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.auth.existingSecret | default (printf "%s-redis" (include "ccea-cloud.fullname" .)) }}
                  key: {{ .Values.redis.auth.existingSecretPasswordKey | default "redis-password" }}
            - name: REDIS_URL
              value: {{ include "ccea-cloud.redisUrl" . | quote }}
            {{- end }}
            - name: CCEA_REGISTRY_URL
              value: {{ include "ccea-cloud.registryUrl" . | quote }}
            {{- if .Values.global.tls.enabled }}
            - name: CCEA_TLS_ENABLED
              value: "true"
            - name: CCEA_TLS_CERT_PATH
              value: "/certs/tls.crt"
            - name: CCEA_TLS_KEY_PATH
              value: "/certs/tls.key"
            {{- end }}
            {{- if .Values.global.mtls.enabled }}
            - name: CCEA_MTLS_ENABLED
              value: "true"
            - name: CCEA_CA_CERT_PATH
              value: "/certs/ca.crt"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            {{- if .Values.global.tls.enabled }}
            - name: tls
              mountPath: /certs
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        {{- if .Values.global.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.global.tls.secretName }}
        {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
