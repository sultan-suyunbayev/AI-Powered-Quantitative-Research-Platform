# CCEA Cloud Helm Values
#
# Default configuration values for CCEA Cloud deployment.
#
# Design Doc Reference: Phase 9 - Enterprise/on-prem pack

# Global settings
global:
  # Image pull secrets for private registries
  imagePullSecrets: []
  # Data residency region
  dataResidency: "on-prem"
  # Air-gapped mode
  airGapped: false
  # TLS configuration
  tls:
    enabled: true
    secretName: ccea-tls
  # mTLS for agent communication
  mtls:
    enabled: false
    caSecretName: ccea-ca

# Control Plane configuration
controlPlane:
  enabled: true
  replicaCount: 2

  image:
    repository: ccea/cloud-control-plane
    tag: ""  # Defaults to Chart appVersion
    pullPolicy: IfNotPresent

  # Resource limits
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "500m"
      memory: 512Mi

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Service configuration
  service:
    type: ClusterIP
    port: 8000
    annotations: {}

  # Ingress configuration
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    hosts:
      - host: ccea.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ccea-tls
        hosts:
          - ccea.local

  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  # Pod security context
  podSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  # Environment variables
  env:
    CCEA_LOG_LEVEL: INFO
    CCEA_TELEMETRY_REDACTION_MANDATORY: "true"

  # Extra environment variables from secrets
  envFrom: []
  # - secretRef:
  #     name: ccea-secrets

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity - prefer spreading across nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: ccea-cloud
                app.kubernetes.io/component: control-plane
            topologyKey: kubernetes.io/hostname

# Builder Service
builder:
  enabled: true
  replicaCount: 1

  image:
    repository: ccea/builder
    tag: ""
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: "4"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 1Gi

  # Signing configuration
  signing:
    enabled: true
    # Use keyless sigstore signing (requires internet)
    keyless: false
    # Secret containing signing key
    keySecretName: ccea-signing-key

  # SBOM generation
  sbom:
    enabled: true
    format: cyclonedx

  # Service account for builder
  serviceAccount:
    create: true
    annotations: {}

# Telemetry Ingester
telemetryIngester:
  enabled: true
  replicaCount: 2

  image:
    repository: ccea/telemetry-ingester
    tag: ""
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "500m"
      memory: 512Mi

  # Redaction is MANDATORY
  redaction:
    mandatory: true
    version: "1.0"

  # Default telemetry level
  defaultLevel: aggregated

# Governance Service
governance:
  enabled: true
  replicaCount: 1

  image:
    repository: ccea/governance
    tag: ""
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "250m"
      memory: 256Mi

  # Retention defaults
  retention:
    telemetryAggregated: 90
    telemetryDetailed: 30
    telemetryRaw: 7
    auditLogs: 365
    commands: 90
    approvals: 365

  # DSAR support
  dsar:
    enabled: true

  # EU-Only Residency Enforcement (GDPR Phase 3)
  residency:
    # Enable EU-only enforcement
    enabled: true
    enforceEuOnly: true

    # Drift check configuration
    driftCheck:
      enabled: true
      # Schedule for automatic drift checks (cron format)
      schedule: "0 * * * *"  # Hourly
      # Fail closed - any non-EU endpoint blocks operation
      failClosed: true
      # Runtime check (in addition to deployment check)
      runtimeCheckEnabled: true
      # Alert on drift detection
      alertOnDrift: true

    # Allowed EU regions
    allowedRegions:
      - "eu-west-1"      # Ireland
      - "eu-west-2"      # London
      - "eu-west-3"      # Paris
      - "eu-central-1"   # Frankfurt
      - "eu-central-2"   # Zurich
      - "eu-north-1"     # Stockholm
      - "eu-south-1"     # Milan
      - "eu-south-2"     # Spain

    # Evidence storage for audit
    evidenceStorage:
      enabled: true
      bucket: ""  # Configure per environment
      prefix: "residency-evidence"
      region: "eu-central-1"
      retentionDays: 365

    # Subprocessor verification
    subprocessorVerification:
      enabled: true
      # Check subprocessor DPA status
      requireSignedDPA: true
      # Review frequency check
      reviewFrequencyDays: 90

# Registry (on-prem artifact storage)
registry:
  enabled: false
  replicaCount: 1

  image:
    repository: registry
    tag: "2"
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "250m"
      memory: 256Mi

  # Storage
  persistence:
    enabled: true
    storageClass: ""
    size: 100Gi

  # Authentication
  auth:
    enabled: false
    htpasswd: ""

# Registry Mirror (for air-gapped)
registryMirror:
  enabled: false
  replicaCount: 1

  # Upstream registry to mirror
  upstream:
    url: https://registry-1.docker.io
    username: ""
    password: ""

  persistence:
    enabled: true
    size: 200Gi

# PostgreSQL (using Bitnami subchart)
postgresql:
  enabled: true
  auth:
    database: ccea_cloud
    username: ccea
    existingSecret: ccea-db-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

  primary:
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: "500m"
        memory: 512Mi

    persistence:
      enabled: true
      size: 50Gi

    # PostgreSQL configuration
    configuration: |
      max_connections = 200
      shared_buffers = 512MB
      work_mem = 16MB
      maintenance_work_mem = 128MB
      effective_cache_size = 1536MB

  # Read replicas for HA
  readReplicas:
    replicaCount: 0

# Redis (using Bitnami subchart)
redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: ccea-redis-secret
    existingSecretPasswordKey: password

  master:
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: "250m"
        memory: 128Mi

    persistence:
      enabled: true
      size: 10Gi

  replica:
    replicaCount: 0

# Network Policies
networkPolicies:
  enabled: true

  # Allow ingress only from specific namespaces
  allowedNamespaces:
    - ingress-nginx
    - monitoring

# Pod Security Policy
podSecurityPolicy:
  enabled: false

# Service Monitor for Prometheus
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

# Evidence Pack Exporter
evidencePackExporter:
  enabled: true
  # Schedule for automatic exports (cron format)
  schedule: "0 2 * * *"  # 2 AM daily
  # Export destination
  destination:
    type: s3  # s3, gcs, azure, local
    bucket: ""
    prefix: "evidence-packs"
  # Retention for exported packs
  retentionDays: 365

# Agent Updates Distribution
agentUpdates:
  enabled: true
  # Staged rollout configuration
  stagedRollout:
    enabled: true
    stages:
      - name: canary
        percentage: 5
        duration: 24h
      - name: early-adopters
        percentage: 25
        duration: 48h
      - name: general
        percentage: 100
        duration: 0
  # Version pinning
  versionPinning:
    enabled: true
    # Minimum supported agent version
    minVersion: "1.0.0"
    # Maximum supported agent version (empty = no limit)
    maxVersion: ""
  # Change windows
  changeWindows:
    enabled: false
    # Allowed days/hours for updates (UTC)
    allowedDays: [1, 2, 3, 4, 5]  # Mon-Fri
    allowedHours:
      start: 9
      end: 17

# Research Job Isolation (Phase 10)
researchJobIsolation:
  enabled: true

  # Default isolation level
  # Options: none (dev only), process, container, gvisor, microvm
  defaultIsolationLevel: container

  # Resource limits (defaults)
  resourceLimits:
    cpu: "1.0"
    memoryMB: 1024
    timeoutSeconds: 3600
    maxPids: 100
    diskQuotaMB: 512

  # Maximum resource limits (cannot exceed)
  maxResourceLimits:
    cpu: "8.0"
    memoryMB: 16384
    timeoutSeconds: 86400
    diskQuotaMB: 10240

  # Container settings
  container:
    image: python:3.11-slim
    network: none  # Disabled by default
    readOnlyRootfs: true
    dropCapabilities: true
    noNewPrivileges: true
    userNamespace: true
    runtime: runc  # runc, runsc (gVisor), kata

  # gVisor settings (high security)
  gvisor:
    enabled: false
    platform: ptrace  # ptrace or kvm

  # Firecracker MicroVM (enterprise)
  microvm:
    enabled: false
    kernelImage: /etc/ccea/firecracker/vmlinux
    rootfsImage: /etc/ccea/firecracker/rootfs.ext4
    # Requires: KVM support, firecracker binary

  # Egress firewall
  egressFirewall:
    enabled: true
    defaultPolicy: deny  # deny or allow
    allowedDomains: []
    blockedDomains: []
    # DNS resolution
    dnsAllowed: false
    # Allow specific ports (when network enabled)
    allowedPorts: [443, 80]

  # Abuse detection
  abuseDetection:
    enabled: true
    # Detection types
    detectCryptoMining: true
    detectPortScanning: true
    detectBotnet: true
    detectHighCpuUsage: true
    # Thresholds
    cpuUsageThresholdPercent: 95
    networkConnectionsLimit: 100
    suspiciousProcessPatterns:
      - "minerd"
      - "xmrig"
      - "stratum"

  # Resource quotas (per tenant)
  quotas:
    enabled: true
    # Quota tiers
    tiers:
      free:
        maxConcurrentJobs: 1
        maxJobDurationSeconds: 3600
        maxCpuCoresPerJob: 1
        maxMemoryMBPerJob: 1024
        maxJobsPerDay: 10
        maxComputeMinutesPerDay: 60
      premium:
        maxConcurrentJobs: 5
        maxJobDurationSeconds: 14400
        maxCpuCoresPerJob: 4
        maxMemoryMBPerJob: 8192
        maxJobsPerDay: 100
        maxComputeMinutesPerDay: 600
      enterprise:
        maxConcurrentJobs: 20
        maxJobDurationSeconds: 86400
        maxCpuCoresPerJob: 8
        maxMemoryMBPerJob: 16384
        maxJobsPerDay: 1000
        maxComputeMinutesPerDay: 6000

  # Tenant isolation
  tenantIsolation:
    enabled: true
    # Isolation enforcement
    enforceNamespaces: true
    enforceNetworkPolicies: true
    # Audit
    auditJobExecution: true

# Cryptographic Signing
signing:
  enabled: true
  # Key storage
  keyStorage:
    type: secret  # secret, vault, kms
    secretName: ccea-signing-keys
  # Ed25519 keys for different purposes
  keys:
    evidencePack:
      keyId: evidence-pack-signer
      # Public key for verification (base64)
      publicKey: ""
    agentUpdate:
      keyId: agent-update-signer
      publicKey: ""
    artifact:
      keyId: artifact-signer
      publicKey: ""
  # Trusted keys for verification
  trustedKeys: []
  # Key rotation
  rotation:
    enabled: false
    intervalDays: 365

# Vault Integration (Key Management)
vault:
  enabled: false
  # HashiCorp Vault
  hashicorp:
    enabled: false
    address: ""
    authMethod: kubernetes  # kubernetes, token, approle
    secretPath: ccea/
    # Kubernetes auth
    role: ccea-cloud
  # AWS KMS
  awsKms:
    enabled: false
    keyId: ""
    region: ""
  # Azure Key Vault
  azureKeyVault:
    enabled: false
    vaultUrl: ""
  # GCP KMS
  gcpKms:
    enabled: false
    keyRing: ""
    keyName: ""
    location: ""
