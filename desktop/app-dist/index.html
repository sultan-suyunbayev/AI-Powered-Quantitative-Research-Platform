<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RivenQuant</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #0E0E11; color: #E5E7EB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      -webkit-user-select: none; user-select: none;
    }
    .logo {
      font-size: 22px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #6366F1, #22D3EE);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { font-size: 12px; color: #6B7280; letter-spacing: 0.04em; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.10);
      border-top-color: #6366F1; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">RivenQuant</div>
    <div class="spinner"></div>
    <div class="sub">Запуск локального движка…</div>
  </div>
</body>
</html>
