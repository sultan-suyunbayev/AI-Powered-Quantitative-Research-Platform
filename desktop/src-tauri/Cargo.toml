[package]
name = "rivenquant-desktop"
version = "2.6.0"
description = "RivenQuant desktop shell (Tauri v2) wrapping the Python backend sidecar"
authors = ["RivenQuant"]
edition = "2021"
rust-version = "1.77"

# The Rust crate produces the desktop binary; the actual UI is served by the
# Python sidecar and rendered in the system webview.
[lib]
name = "rivenquant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "io-util", "macros", "rt", "net"] }

[features]
# This feature is used for production builds or when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
