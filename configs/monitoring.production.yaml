# =============================================================================
# Production Monitoring Configuration
# =============================================================================
#
# This configuration enables full monitoring with recommended production thresholds.
# Use this as a baseline for production deployments.
#
# Tech Debt Closure: Reliability/Operations - monitoring.yaml disabled
# Control Artifact: This file documents production-ready monitoring settings
#
# Usage:
#   Copy to monitoring.yaml or use --config configs/monitoring.production.yaml
#
# =============================================================================

monitoring:
  enabled: true                 # PRODUCTION: Enable monitoring, snapshots, and kill switch
  snapshot_metrics_sec: 60      # Metrics snapshot interval (seconds)
  tick_sec: 1.0                 # Monitoring aggregator loop frequency (seconds)

# -----------------------------------------------------------------------------
# Kill Switch Thresholds (Safety Controls)
# These thresholds trigger safe mode (halt trading) when exceeded
# -----------------------------------------------------------------------------
thresholds:
  feed_lag_ms: 5000             # Enter safe mode if feed lag > 5 seconds
  ws_failures: 10               # Enter safe mode after 10 consecutive WebSocket failures
  error_rate: 0.05              # Enter safe mode if signal error rate > 5%
  fill_ratio_min: 0.5           # Alert if fill ratio < 50%
  pnl_min: -10000.0             # Alert if daily PnL drops below threshold (currency units)
  zero_signals: 300             # Alert after 300 consecutive zero-signal bars (~5 min at 1s bars)
  cost_bias_bps: 50.0           # Alert if cost bias exceeds 50 bps

# -----------------------------------------------------------------------------
# Alerting Configuration
# -----------------------------------------------------------------------------
alerts:
  enabled: true                 # PRODUCTION: Enable external alerting
  command: null                 # Custom command to execute (optional)
  channel: telegram             # Alert delivery: 'noop', 'telegram', or custom
  cooldown_sec: 300             # Minimum 5 minutes between repeated alerts

  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN   # Environment variable containing bot token
    chat_id_env: TELEGRAM_CHAT_ID       # Environment variable containing chat ID

# -----------------------------------------------------------------------------
# SLO/SLI Targets (Documentation Only - Enforced in Observability Stack)
# -----------------------------------------------------------------------------
# These are design targets per Documentation Canon - actual values require
# validated monitoring infrastructure deployment.
#
# SLO-1: System Availability
#   Target: 99.5% uptime during market hours
#   Measurement: Agent heartbeat success rate
#
# SLO-2: Alert Latency
#   Target: < 60 seconds from threshold breach to alert delivery
#   Measurement: Alert timestamp vs threshold breach timestamp
#
# SLO-3: Kill Switch Response
#   Target: < 5 seconds from trigger to trading halt
#   Measurement: Kill switch activation timestamp vs trigger event
#
# SLO-4: Data Feed Freshness
#   Target: < 5 seconds feed lag during market hours
#   Measurement: feed_lag_ms metric
# -----------------------------------------------------------------------------

