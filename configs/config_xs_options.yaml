# Cross-Sectional OPTIONS preset (Stage B5) — ОТДЕЛЬНЫЙ greeks-space оптимизатор.
# ⚠️ Опционы — другая машинерия: портфель ЭКСПОЗИЦИЙ по греческим (delta/vega/gamma-neutral),
#    а НЕ directional веса (B1-B4). Поэтому конструктор отдельный:
#       service_options_portfolio.OptionsPortfolioConstructor (null-space проекция)
#    и API: POST /api/xs/options/construct  (demo:true → синтетический бук без данных).
#
# Сигналы (signals/options_signals): VRP (IV−RV), skew (put−call IV), dispersion, term-structure
#    → альфа по ногам → greeks-нейтральная структура. Все graceful = BYO-слот.
#
# ⚠️ HONEST-NOTE (данные):
#    • Опционные данные обычно платные. Free: yfinance option chains (EOD, ограниченно) +
#      BYO Deribit (крипто-опционы, free) — см. adapters/deribit, adapters/theta_data.
#    • IV/RV/skew/dispersion/term — BYO колонки; без них сигналы нейтральны (NaN).

mode: cross_sectional
asset_class: options

# Сигналы привлекательности vol-структур (по символам/андерлаям):
signals:
  - {name: vrp,            kind: vrp,            transforms: [zscore]}   # IV − realized vol
  - {name: skew,           kind: skew,           transforms: [zscore]}   # put − call IV (25Δ)
  - {name: dispersion,     kind: dispersion,     transforms: [zscore]}   # index − single-name IV
  - {name: term_structure, kind: term_structure, transforms: [zscore]}   # front − back IV

# Greeks-space конструктор (для /api/xs/options/construct):
options_portfolio:
  neutralize: [delta, vega]   # нейтрализуемые греки (delta|gamma|vega|theta|rho)
  gross_max: 1.0              # суммарный |вес| (контракты, нормированный)
  max_position: 0.30          # клип на ногу
  demo_underlying: SPX        # синтетический бук по умолчанию
  demo_spot: 100.0

# Vol-факторная риск-модель (xs_risk/options_factors): level/skew/term — для risk-вью/attribution
vol_factors:
  vol_index_symbol: VIX       # vol-индекс (VIX/DVOL); иначе равновзвеш. прокси изменений IV

# Stage D5: IV-обогащение (для source: free + enrich: [iv, realized_vol] — сигналы VRP/skew/term оживают):
iv_vendor: deribit            # deribit (крипто-опционы, history→approx) | yfinance (US EOD снимок→none, не backtest-safe)
# data:
#   source: free
#   enrich: [iv, realized_vol]   # iv: deribit/yfinance; realized_vol: из close (PIT-true)
