# Cross-Sectional FOREX preset (Stage B4) — G10 carry+momentum на готовый движок.
# Запуск:  python script_xs_backtest.py --config configs/config_xs_forex.yaml
# Источник synthetic → работает без данных. Для реальных бесплатных данных:
#   data.source: free, data.vendor: oanda  (practice-аккаунт OANDA, дневные FX-бары).
#
# ⚠️ HONEST-NOTE:
#   • Carry требует дифференциал ставок (rate_diff / rate_base+rate_quote) — BYO/free-loader.
#   • Value/PPP требует ppp/reer_gap колонку (BYO) — иначе прокси через long-horizon mean-reversion.
#   • FX-юниверс мал (G10 ~9 пар) → факторная Σ держит МИНИМУМ непрерывных факторов
#     (usd_beta + carry + value), без раздувания one-hot, чтобы регрессия не вырождалась.
#   • USD-neutral: net_target=0 (сумма весов 0 → нейтральность к доллару при котировках vs USD).

mode: cross_sectional
asset_class: forex
usd_symbol: DXY            # USD-индекс если в данных; иначе равновзвеш. прокси корзины

data:
  source: synthetic        # synthetic | free (oanda) | parquet (BYO)
  vendor: oanda
  symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD, EURGBP, EURJPY]
  synthetic_bars: 400
  synthetic_seed: 23
  cache: true
  # Stage D3 — для source: free (OANDA practice, нужны OANDA_API_KEY/ACCOUNT_ID) раскомментируйте:
  # enrich: [rate_diff]    # rate_base/rate_quote/rate_diff из policy_rates (snapshot=approx; BYO history=PIT)

# Stage D3: ставки по валютам (snapshot, pit=approx). Дифференциал ставок «оживляет» fx_carry.
# Замените на BYO history (publish_ts) для честного PIT. Значения иллюстративные (G10 policy rates):
policy_rates: {USD: 0.045, EUR: 0.035, GBP: 0.0475, JPY: 0.001, CHF: 0.015, AUD: 0.0435, CAD: 0.045, NZD: 0.045}

universe:
  type: static
  symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD, EURGBP, EURJPY]

signals:
  # Трендовые — честны на FX-курсах:
  - {name: fx_mom_90,  kind: fx_momentum, lookback: 90,  transforms: [winsorize, zscore]}
  - {name: fx_mom_180, kind: fx_momentum, lookback: 180, transforms: [zscore]}
  # Value/PPP-прокси (mean-reversion) — честен на ценах:
  - {name: fx_value,   kind: fx_value, lookback: 250, transforms: [zscore]}
  # Stage D3: fx_carry «оживает» на source: free + enrich: [rate_diff] (policy_rates ниже). terms = BYO:
  # - {name: fx_carry, kind: fx_carry, transforms: [winsorize, zscore]}
  # - {name: terms,    kind: terms_of_trade, transforms: [zscore]}

alpha:
  method: ic_weighted

risk:
  type: forex_factor       # USD-beta + carry + value факторная модель (Σ = BFBᵀ+D)
  method: ledoit_wolf

# Forex-факторы (для risk.type=forex_factor) — carries/values как BYO-метаданные (опц.):
blocs: {EURUSD: G10, GBPUSD: G10, USDJPY: G10, USDCHF: G10, AUDUSD: commodity, USDCAD: commodity, NZDUSD: commodity, EURGBP: G10, EURJPY: G10}

optimizer:
  objective: mean_variance
  risk_aversion: 5.0
  gross_max: 1.0
  net_target: 0.0          # USD-neutral (сумма весов 0)
  long_only: false
  max_position: 0.30       # малый юниверс → допускаем крупнее позиции

backtest:
  rebalance_every: 5       # weekly на дневных барах
  cov_lookback: 60
  min_cov_obs: 30
  alpha_refit_every: 5
  cost_bps: 1.0            # FX очень ликвиден (узкие спреды)
  price_col: close
  periods_per_year: 252

n_trials: 5
