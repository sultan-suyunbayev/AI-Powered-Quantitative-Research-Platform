# Digital Operational Resilience Strategy Configuration
# DORA Article 6(8) - Digital Operational Resilience Strategy
#
# NOTE: This platform is an ICT Provider / Software Provider (DORA Art. 30),
# NOT a Financial Entity (DORA Art. 2). We implement operational resilience
# best practices to support our B2B Financial Entity clients, but we are
# NOT subject to the full FE DORA framework.
#
# IMPORTANT: All KPIs, RTO/RPO values, uptime targets, and tolerance thresholds
# in this configuration are ILLUSTRATIVE DESIGN GOALS for client Financial Entity
# configurations — NOT contractual SLA commitments by CustodiaCloud. Actual
# operational targets are defined in executed service agreements after operational
# validation. CustodiaCloud is a pre-revenue company with no production uptime
# history; these values serve as planning references only.
#
# This configuration defines the strategic approach to digital operational resilience
# as required by Regulation (EU) 2022/2554 (DORA).
#
# References:
#   - DORA Article 6(8): https://www.digital-operational-resilience-act.com/Article_6.html
#   - RTS on ICT Risk Management Framework: CDR 2024/1774
#   - ENISA Guidelines on ICT Security Risk Management

# =============================================================================
# Strategy Identification
# =============================================================================
strategy:
  name: "Digital Operational Resilience Strategy"
  version: "1.0.0"
  effective_date: ""  # Auto-set if empty
  next_review_date: ""  # Auto-set to 1 year if empty
  approved_by: ""
  approved_date: ""

  # Entity identification
  # NOTE: We are an ICT Provider (Art. 30), NOT a Financial Entity
  firm:
    name: ""
    lei: ""
    type: "ict_provider"  # We are ICT Provider, NOT investment_firm
    proportionality_tier: "standard"  # simplified, standard, enhanced
    is_microenterprise: false

# =============================================================================
# Strategic Objectives (Article 6(8))
# =============================================================================
# "Digital operational resilience strategy shall set out how the digital
# operational resilience framework is implemented"

objectives:
  # Primary objectives
  primary:
    - id: "OBJ-001"
      name: "ICT Risk Management Excellence"
      description: "Maintain a comprehensive ICT risk management framework"
      target_date: ""
      kpi: "Zero critical ICT incidents"

    - id: "OBJ-002"
      name: "Continuous Improvement"
      description: "Continuously improve ICT risk management practices based on lessons learned"
      target_date: ""
      kpi: "100% post-incident reviews completed within 30 days"

    - id: "OBJ-003"
      name: "Third-Party Resilience"
      description: "Ensure resilience of critical third-party ICT service providers"
      target_date: ""
      kpi: "All critical providers assessed annually"

    - id: "OBJ-004"
      name: "Incident Response Readiness"
      description: "Maintain effective incident response and recovery capabilities"
      target_date: ""
      kpi: "Recovery within RTO for 99.9% of incidents (design goal; pending DR validation)"

  # Supporting objectives
  supporting:
    - id: "OBJ-101"
      name: "Staff Competency"
      description: "Ensure all staff have appropriate ICT risk awareness and skills"
      target_date: ""
      kpi: "100% training completion rate"

    - id: "OBJ-102"
      name: "Testing Maturity"
      description: "Advance testing capabilities including TLPT where required"
      target_date: ""
      kpi: "Annual TLPT completed (if in scope)"

    - id: "OBJ-103"
      name: "Information Sharing"
      description: "Participate in relevant threat intelligence sharing arrangements"
      target_date: ""
      kpi: "Active participation in at least one sharing arrangement"

# =============================================================================
# ICT Systems and Dependencies (Article 6(8)(a))
# =============================================================================
# "Methods to address ICT risk quickly, efficiently and comprehensively"

ict_systems:
  # Critical function mapping
  # NOTE: RTO/RPO values below are illustrative design goals for client FE configurations,
  # NOT operational commitments by CustodiaCloud. Actual recovery targets require DR
  # testing validation and are defined in executed service agreements.
  critical_functions:
    - function: "Trading Execution"
      rto_hours: 4   # Design goal; pending DR test validation
      rpo_hours: 0.25  # Design goal; pending DR test validation
      systems:
        - name: "Order Management System"
          criticality: "critical"
        - name: "Market Data Feed"
          criticality: "critical"
        - name: "Trading Engine"
          criticality: "critical"

    - function: "Risk Management"
      rto_hours: 2
      rpo_hours: 0.5
      systems:
        - name: "Real-time Risk Calculator"
          criticality: "critical"
        - name: "Position Management"
          criticality: "critical"

    - function: "Client Reporting"
      rto_hours: 24
      rpo_hours: 4
      systems:
        - name: "Report Generation Engine"
          criticality: "important"
        - name: "Client Portal"
          criticality: "important"

  # Third-party dependencies
  third_party_critical:
    - provider_type: "cloud_computing"
      concentration_risk: "high"
      exit_strategy_defined: true

    - provider_type: "market_data"
      concentration_risk: "medium"
      exit_strategy_defined: true

    - provider_type: "trading_venue_connectivity"
      concentration_risk: "high"
      exit_strategy_defined: true

# =============================================================================
# Risk Appetite and Tolerance (Article 6(8)(b))
# =============================================================================
# "ICT risk tolerance levels"

risk_appetite:
  # Overall risk appetite statement
  statement: >
    The organization maintains a low appetite for ICT risks that could impact
    operational resilience, client service, or regulatory compliance. We accept
    moderate risk in pursuit of innovation where appropriate controls are in place.

  # Quantitative tolerances
  # NOTE: All tolerance values are illustrative design goals, NOT operational
  # commitments. Actual SLA targets are contract-specific and require operational validation.
  tolerances:
    # Availability (design goals; actual SLA per executed agreement)
    critical_system_uptime_target_pct: 99.95  # Design goal; no production uptime history
    important_system_uptime_target_pct: 99.9  # Design goal; no production uptime history

    # Incidents
    max_critical_incidents_per_year: 0
    max_major_incidents_per_year: 4
    max_acceptable_mttr_critical_hours: 4
    max_acceptable_mttr_major_hours: 24

    # Recovery
    max_rto_critical_systems_hours: 4
    max_rpo_critical_systems_hours: 1

    # Third-party
    max_single_provider_concentration_pct: 30
    min_third_party_audit_score_pct: 80

    # Security
    max_unpatched_critical_vulns_days: 14
    max_unpatched_high_vulns_days: 30
    mandatory_penetration_test_frequency_months: 12

  # Breach escalation
  breach_escalation:
    immediate_escalation_to_management: true
    regulatory_reporting_threshold: "material"
    board_reporting_frequency: "quarterly"

# =============================================================================
# Key Performance Indicators (Article 6(8)(c))
# =============================================================================
# "ICT-related key performance indicators"

kpis:
  # Availability KPIs
  availability:
    - name: "System Uptime"
      metric: "uptime_percentage"
      target: 99.95
      warning_threshold: 99.9
      critical_threshold: 99.5
      measurement_frequency: "continuous"

    - name: "Mean Time Between Failures"
      metric: "mtbf_hours"
      target: 2160  # 90 days
      warning_threshold: 720  # 30 days
      critical_threshold: 168  # 7 days
      measurement_frequency: "monthly"

  # Incident KPIs
  incident:
    - name: "Mean Time to Detect"
      metric: "mttd_minutes"
      target: 5
      warning_threshold: 15
      critical_threshold: 60
      measurement_frequency: "per_incident"

    - name: "Mean Time to Respond"
      metric: "mttr_minutes"
      target: 30
      warning_threshold: 60
      critical_threshold: 240
      measurement_frequency: "per_incident"

    - name: "Incident Resolution Rate"
      metric: "resolution_rate_within_sla_pct"
      target: 95
      warning_threshold: 90
      critical_threshold: 80
      measurement_frequency: "monthly"

  # Security KPIs
  security:
    - name: "Vulnerability Remediation Time"
      metric: "avg_remediation_days"
      target: 14
      warning_threshold: 21
      critical_threshold: 30
      measurement_frequency: "monthly"

    - name: "Security Training Completion"
      metric: "training_completion_pct"
      target: 100
      warning_threshold: 90
      critical_threshold: 80
      measurement_frequency: "quarterly"

    - name: "Phishing Test Pass Rate"
      metric: "phishing_pass_rate_pct"
      target: 95
      warning_threshold: 85
      critical_threshold: 75
      measurement_frequency: "quarterly"

  # Third-party KPIs
  third_party:
    - name: "Provider SLA Compliance"
      metric: "sla_compliance_pct"
      target: 99
      warning_threshold: 95
      critical_threshold: 90
      measurement_frequency: "monthly"

    - name: "Provider Assessment Completion"
      metric: "assessment_completion_pct"
      target: 100
      warning_threshold: 90
      critical_threshold: 75
      measurement_frequency: "annual"

# =============================================================================
# Communication Strategy (Article 6(8)(d))
# =============================================================================
# "ICT-related communication with stakeholders"

communication:
  # Internal communication
  internal:
    management_body:
      frequency: "quarterly"
      format: "dashboard_and_report"
      content:
        - "Executive summary of ICT risk posture"
        - "Key incidents and near misses"
        - "Third-party risk status"
        - "Testing results summary"
        - "KPI performance"
        - "Strategic initiative progress"

    senior_management:
      frequency: "monthly"
      format: "report"
      content:
        - "ICT risk dashboard"
        - "Incident summary"
        - "Control effectiveness"
        - "Resource utilization"

    operational_teams:
      frequency: "weekly"
      format: "briefing"
      content:
        - "Current threat landscape"
        - "Operational issues"
        - "Upcoming changes"
        - "Action items"

  # External communication
  external:
    regulators:
      nca_jurisdiction: ""
      major_incident_notification_hours: 4
      annual_report_deadline: "Q1"

    clients:
      incident_notification: "material_impact_only"
      transparency_report_frequency: "annual"

    third_parties:
      provider_performance_review: "quarterly"
      security_questionnaire_frequency: "annual"

# =============================================================================
# Testing Strategy (Article 6(8)(e))
# =============================================================================
# "Testing the digital operational resilience"

testing:
  # Testing program
  program:
    annual_test_plan_required: true
    test_plan_approval_required: true
    test_results_board_reporting: true

  # Test types and frequencies
  test_types:
    vulnerability_assessment:
      frequency_months: 3
      scope: "all_critical_systems"
      external_required: true
      remediation_tracking: true

    penetration_testing:
      frequency_months: 12
      scope: "critical_and_important_systems"
      external_required: true
      threat_scenarios_required: true

    business_continuity_testing:
      frequency_months: 12
      scope: "critical_functions"
      tabletop_exercises: true
      full_failover_tests: true

    disaster_recovery_testing:
      frequency_months: 12
      scope: "critical_systems"
      recovery_time_validation: true
      data_integrity_validation: true

    threat_led_penetration_testing:  # TLPT
      required: false  # Set based on proportionality assessment
      frequency_months: 36
      framework: "TIBER-EU"
      scope: "critical_functions_and_systems"

  # Post-test activities
  post_test:
    findings_documentation_required: true
    remediation_plan_required: true
    retesting_required: true
    lessons_learned_review: true

# =============================================================================
# Third-Party Strategy (Article 6(8)(f))
# =============================================================================
# "Strategy on third-party ICT risk"

third_party:
  # Policy framework
  policy:
    third_party_policy_required: true
    concentration_risk_policy_required: true
    exit_strategy_mandatory: true
    subcontracting_approval_required: true

  # Due diligence requirements
  due_diligence:
    pre_contract_assessment_required: true
    security_assessment_required: true
    financial_stability_check_required: true
    bcm_capability_assessment_required: true

  # Monitoring requirements
  monitoring:
    continuous_monitoring_enabled: true
    performance_review_frequency: "quarterly"
    risk_reassessment_frequency: "annual"
    audit_rights_required: true

  # Concentration risk management
  concentration_risk:
    max_critical_services_single_provider: 3
    mandatory_alternative_provider_analysis: true
    concentration_reporting_frequency: "semi_annual"

# =============================================================================
# Continuous Improvement (Article 6(8)(g))
# =============================================================================
# "Implement continuous improvement measures"

continuous_improvement:
  # Improvement framework
  framework:
    post_incident_review_mandatory: true
    lessons_learned_process: true
    root_cause_analysis_methodology: "5_whys_and_fishbone"
    knowledge_base_maintenance: true

  # Improvement sources
  sources:
    - "Incident post-mortems"
    - "Audit findings"
    - "Test results"
    - "Near-miss analysis"
    - "Industry benchmarking"
    - "Regulatory guidance"
    - "Threat intelligence"
    - "Employee suggestions"

  # Improvement tracking
  tracking:
    improvement_register_required: true
    priority_classification: true
    progress_reporting_frequency: "monthly"
    completion_verification: true

  # Maturity assessment
  maturity:
    self_assessment_frequency: "annual"
    external_assessment_frequency: "biennial"
    target_maturity_level: 4  # 1-5 scale
    maturity_model: "CMMI"

# =============================================================================
# Resource Allocation (Article 6(8)(h))
# =============================================================================
# "Resource allocation for digital operational resilience"

resources:
  # Budget allocation
  budget:
    annual_budget_planning: true
    board_approval_required: true
    multi_year_planning_enabled: true
    contingency_reserve_pct: 10

  # Budget categories
  categories:
    security_infrastructure_pct: 30
    resilience_testing_pct: 15
    training_and_awareness_pct: 10
    third_party_management_pct: 15
    incident_response_pct: 10
    continuous_improvement_pct: 10
    contingency_pct: 10

  # Human resources
  human_resources:
    dedicated_ict_risk_team: true
    minimum_team_size: 3
    outsourcing_allowed: true
    critical_roles_backup_required: true

  # Training investment
  training:
    mandatory_training_hours_per_year: 16
    specialized_certification_support: true
    conference_attendance_budget: true

# =============================================================================
# Strategy Review and Update
# =============================================================================
review:
  # Review triggers
  triggers:
    scheduled_review_months: 12
    post_major_incident: true
    regulatory_change: true
    significant_business_change: true
    significant_technology_change: true

  # Review process
  process:
    review_committee: "ICT Risk Committee"
    approval_authority: "Management Body"
    documentation_requirements: "Full rationale and evidence"
    version_control: true

  # Distribution
  distribution:
    internal_communication_required: true
    staff_acknowledgment_required: true
    training_update_required: true
