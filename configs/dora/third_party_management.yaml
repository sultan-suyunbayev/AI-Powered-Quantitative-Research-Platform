# =============================================================================
# DORA Phase 4: Third-Party ICT Risk Management Configuration
# =============================================================================
#
# NOTE: This platform is an ICT Provider / Software Provider (DORA Art. 30),
# NOT a Financial Entity (DORA Art. 2).
#
# This configuration serves TWO purposes:
# 1. Managing OUR third-party providers (Art. 30 requirements for ICT Providers)
# 2. Helping FE CLIENTS generate their ROI data (FE obligation under Art. 28(3))
#
# Sections marked "FOR FE CLIENTS" are tools to help our B2B clients with their
# DORA compliance, NOT our own obligations.
#
# Configuration for Articles 28-44 of Regulation (EU) 2022/2554 (DORA)
# Covering ICT Third-Party Risk Management Framework
#
# References:
#   - Article 28: General Principles on ICT Third-Party Risk Management
#   - Article 28(3): Register of Information
#   - Article 28(8): Exit Strategies
#   - Article 29: Concentration Risk
#   - Article 30: Contractual Arrangements
#   - Articles 31-44: Critical Third-Party Provider (CTPP) Oversight
#
# Last Updated: 2025-01-17
# =============================================================================

# -----------------------------------------------------------------------------
# Third-Party Risk Management (Article 28)
# -----------------------------------------------------------------------------
third_party_risk:
  # Provider management
  provider_management:
    # Risk classification thresholds
    risk_thresholds:
      critical_threshold: 80
      high_threshold: 60
      medium_threshold: 40
      low_threshold: 20

    # Due diligence requirements
    due_diligence:
      require_financial_assessment: true
      require_security_assessment: true
      require_compliance_check: true
      require_bcm_assessment: true
      min_security_score: 70
      min_financial_rating: "B"

    # Review frequency (months)
    review_frequency:
      critical_providers: 6
      high_risk_providers: 12
      standard_providers: 24

    # Notifications
    notify_on_risk_change: true
    notify_on_assessment_due: true
    notification_days_before_review: 30

  # Service management
  service_management:
    # Criticality assessment
    criticality:
      revenue_impact_threshold_pct: 10
      operational_impact_threshold: "high"
      regulatory_impact_threshold: "material"

    # SLA requirements
    sla_requirements:
      require_availability_sla: true
      min_availability_pct: 99.5
      require_rpo_rto: true
      max_rto_hours: 4
      max_rpo_hours: 1

# -----------------------------------------------------------------------------
# Register of Information (Article 28(3))
# -----------------------------------------------------------------------------
# NOTE: FOR FE CLIENTS ONLY
# ROI submission is an obligation of Financial Entities, not ICT Providers.
# This section helps our FE clients generate ROI data about us as their provider.
# We (as ICT Provider) provide data to support their submissions.
register_of_information:
  # ITS submission settings
  its_submission:
    # Template format (per CIR 2024/2956)
    format: "csv"
    encoding: "utf-8"
    date_format: "YYYY-MM-DD"

    # Submission schedule
    submission_frequency: "annual"
    submission_deadline_month: 3
    submission_deadline_day: 31

    # Competent authority
    nca_code: ""  # Set to your NCA code
    nca_email: ""  # Set to NCA submission email

  # Entity information
  # NOTE: This is for FE CLIENT configuration, not for this platform
  # FE clients fill this with THEIR entity information for ROI submission
  entity:
    lei: ""  # FE client's Legal Entity Identifier
    entity_name: ""  # FE client's name
    entity_type: ""  # FE client's type: credit_institution, investment_firm, etc.
    member_state: ""  # FE client's ISO country code

  # Template configuration
  templates:
    # Enable/disable templates
    b01_entity_maintained: true
    b02_branch_maintained: true
    b03_subsidiaries: true
    b04_ict_services: true
    b05_functions: true
    b06_arrangements: true
    b07_providers: true
    b99_subcontracting: true

  # Validation settings
  validation:
    strict_mode: true
    require_lei_validation: true
    require_country_code_validation: true
    auto_generate_ids: true

# -----------------------------------------------------------------------------
# Exit Strategies (Article 28(8))
# -----------------------------------------------------------------------------
exit_strategies:
  # Exit plan requirements
  exit_plans:
    # Mandatory for critical services
    require_for_critical: true
    require_for_ctpp: true
    require_for_high_risk: true

    # Plan completeness
    require_alternative_providers: true
    min_alternative_providers: 2
    require_transition_timeline: true
    require_cost_estimates: true
    require_risk_assessment: true

    # Review frequency
    review_frequency_months: 12
    test_frequency_months: 24

  # Exit triggers
  triggers:
    service_degradation_threshold_pct: 20
    sla_breach_count_trigger: 3
    security_incident_severity: "high"
    financial_stability_rating: "C"

  # Transition requirements
  transition:
    max_transition_duration_months: 12
    require_data_migration_plan: true
    require_knowledge_transfer: true
    require_parallel_operation: true
    parallel_operation_min_days: 30

  # Cost estimation
  cost_categories:
    - internal_resources
    - external_consultants
    - new_provider_setup
    - data_migration
    - testing_validation
    - parallel_operations
    - training
    - legal_fees

# -----------------------------------------------------------------------------
# Concentration Risk (Article 29)
# -----------------------------------------------------------------------------
concentration_risk:
  # Risk thresholds
  thresholds:
    # Provider concentration
    provider_warning_pct: 30
    provider_critical_pct: 50

    # Geographic concentration
    geographic_warning_pct: 40
    geographic_critical_pct: 60

    # Single country data threshold
    single_country_data_max_pct: 70

    # HHI thresholds (Herfindahl-Hirschman Index)
    hhi_moderate: 1500
    hhi_concentrated: 2500

  # Limits
  limits:
    max_critical_functions_per_provider: 3
    min_providers_per_critical_function: 2
    max_ctpp_dependency_pct: 40
    max_single_provider_services_pct: 50

  # Assessment configuration
  assessment:
    frequency_months: 6
    scope_levels:
      - entity
      - sub_consolidated
      - consolidated

    # Metrics to calculate
    metrics:
      - provider_hhi
      - geographic_concentration
      - function_coverage
      - ctpp_ratio
      - substitutability
      - subcontractor_concentration

  # Notifications
  notifications:
    notify_on_threshold_breach: true
    notify_on_new_critical_risk: true
    escalate_critical_risks: true

# -----------------------------------------------------------------------------
# Contractual Requirements (Article 30)
# -----------------------------------------------------------------------------
contractual_requirements:
  # Basic requirements (all contracts)
  basic_requirements:
    - service_description
    - locations_data_processing
    - locations_data_storage
    - data_protection_provisions
    - service_availability_levels
    - data_portability
    - assistance_with_transitions
    - cooperation_with_authorities
    - termination_rights

  # Additional requirements for critical/important functions
  critical_function_requirements:
    - full_service_level_descriptions
    - performance_targets
    - notice_periods
    - reporting_obligations
    - sub_outsourcing_requirements
    - business_continuity_plans
    - access_and_audit_rights
    - security_requirements
    - incident_notification_requirements
    - exit_strategy_support

  # SLA configuration
  sla:
    require_quantitative_targets: true
    require_monitoring_procedures: true
    require_remediation_procedures: true
    require_penalties_incentives: true

    # Standard targets
    default_availability_pct: 99.5
    default_response_time_hours: 4
    default_resolution_time_hours: 24

  # Gap analysis
  gap_analysis:
    auto_identify_gaps: true
    generate_remediation_plan: true
    track_remediation_progress: true

# -----------------------------------------------------------------------------
# CTPP Oversight (Articles 31-44)
# -----------------------------------------------------------------------------
ctpp_oversight:
  # Assessment requirements
  assessment:
    frequency_months: 6
    require_exit_plan: true
    require_alternatives: true
    min_alternatives: 1
    require_annual_review: true

  # Notification settings
  notifications:
    notify_on_new_recommendation: true
    notify_on_oversight_exercise: true
    notify_days_before_deadline: 14

  # Compliance tracking
  compliance:
    track_recommendation_compliance: true
    require_evidence_collection: true
    escalate_overdue_actions: true

  # Known CTPPs (as of November 2025)
  known_ctpps:
    - name: "Amazon Web Services EMEA SARL"
      lei: "549300FM8DP0RYK05T08"
      lead_overseer: "EBA"
    - name: "Google Cloud EMEA Limited"
      lei: "549300U0LCRNP0LXO379"
      lead_overseer: "ESMA"
    - name: "Microsoft Ireland Operations Limited"
      lei: "635400VB27VF2FPU6G28"
      lead_overseer: "EBA"
    - name: "ServiceNow Nederland B.V."
      lei: "724500YKNF7N9MTJXJ40"
      lead_overseer: "EBA"
    - name: "Oracle Corporation"
      lei: "1Z4GXXU7ZHVWFCD8TV52"
      lead_overseer: "EBA"
    - name: "Salesforce Inc."
      lei: "549300SZXWL54PRYBO13"
      lead_overseer: "EBA"

  # CTPP-specific contract requirements
  contract_requirements:
    - ctpp_status_acknowledgment
    - lead_overseer_access
    - cooperation_with_oversight
    - cross_border_coordination
    - recommendation_implementation
    - enhanced_exit_strategy
    - transition_support_commitment
    - information_provision_obligations

# -----------------------------------------------------------------------------
# Logging and Monitoring
# -----------------------------------------------------------------------------
logging:
  # Log paths
  paths:
    third_party_risk: "logs/dora/third_party_risk"
    register_of_information: "logs/dora/register_of_information"
    exit_strategies: "logs/dora/exit_strategies"
    concentration_risk: "logs/dora/concentration_risk"
    contractual_requirements: "logs/dora/contractual_requirements"
    ctpp_oversight: "logs/dora/ctpp_oversight"

  # Log settings
  settings:
    log_all_events: true
    log_retention_days: 2555  # 7 years per DORA Article 28(14)
    compress_old_logs: true

# -----------------------------------------------------------------------------
# Reporting Configuration
# -----------------------------------------------------------------------------
reporting:
  # Report types
  reports:
    provider_inventory:
      frequency: "monthly"
      format: ["pdf", "xlsx"]

    risk_assessment_summary:
      frequency: "quarterly"
      format: ["pdf"]

    concentration_analysis:
      frequency: "quarterly"
      format: ["pdf", "xlsx"]

    contractual_compliance:
      frequency: "quarterly"
      format: ["pdf"]

    ctpp_status:
      frequency: "monthly"
      format: ["pdf"]

    exit_readiness:
      frequency: "quarterly"
      format: ["pdf"]

    its_submission:
      frequency: "annual"
      format: ["csv"]

  # Distribution
  distribution:
    management_board: true
    risk_committee: true
    compliance_function: true
    internal_audit: true
