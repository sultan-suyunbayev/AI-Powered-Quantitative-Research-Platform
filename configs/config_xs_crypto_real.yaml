# Cross-Sectional CRYPTO — РЕАЛЬНЫЕ данные (Binance public, без ключей).
# Запуск:
#   PYTHONPATH=.venv/Lib/site-packages python script_xs_backtest.py \
#       --config configs/config_xs_crypto_real.yaml --out reports/xs_crypto_real_trust_report.json
#
# data.source: free + vendor: binance → исторические дневные бары Binance (limit=1000 ≈ 2.7 года).
# Цены крипты — pit_quality=true (наблюдаемые), значит Trust-Report backtest-safe (в отличие от synthetic).
# Символы — ПОЛНЫЕ тикеры Binance (BTCUSDT, ...): короткие 'BTC' возвращают 400.

mode: cross_sectional
asset_class: crypto
btc_symbol: BTCUSDT

data:
  source: free
  vendor: binance
  timeframe: "1d"
  symbols: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT, ADAUSDT, DOGEUSDT, LINKUSDT, LTCUSDT, BCHUSDT, AVAXUSDT, DOTUSDT, TRXUSDT, ATOMUSDT]
  cache: true                # parquet-кэш баров (защита от free rate-limit)

universe:
  type: static
  symbols: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, XRPUSDT, ADAUSDT, DOGEUSDT, LINKUSDT, LTCUSDT, BCHUSDT, AVAXUSDT, DOTUSDT, TRXUSDT, ATOMUSDT]

signals:
  - {name: mom_90,     kind: crypto_momentum, lookback: 90, skip: 7, transforms: [winsorize, zscore]}
  - {name: mom_30,     kind: crypto_momentum, lookback: 30, skip: 1, transforms: [zscore]}
  - {name: reversal_5, kind: reversal,        window: 5,            transforms: [zscore]}

alpha:
  method: ic_weighted

risk:
  type: crypto_factor        # BTC-beta + size + sector факторная модель (Σ = BFBᵀ+D)
  method: ledoit_wolf

# Крипто-факторы (для risk.type=crypto_factor) — ключи = символы юниверса
sectors:
  BTCUSDT: L1
  ETHUSDT: L1
  BNBUSDT: L1
  SOLUSDT: L1
  XRPUSDT: Payments
  ADAUSDT: L1
  DOGEUSDT: Meme
  LINKUSDT: DeFi
  LTCUSDT: Payments
  BCHUSDT: Payments
  AVAXUSDT: L1
  DOTUSDT: L1
  TRXUSDT: L1
  ATOMUSDT: L1
mcaps:
  BTCUSDT: 1300
  ETHUSDT: 400
  BNBUSDT: 90
  SOLUSDT: 80
  XRPUSDT: 120
  ADAUSDT: 20
  DOGEUSDT: 20
  LINKUSDT: 10
  LTCUSDT: 7
  BCHUSDT: 9
  AVAXUSDT: 14
  DOTUSDT: 9
  TRXUSDT: 24
  ATOMUSDT: 3

optimizer:
  objective: mean_variance
  risk_aversion: 5.0
  gross_max: 1.0
  net_target: 0.0            # market-neutral
  long_only: false
  max_position: 0.25

backtest:
  rebalance_every: 7         # weekly на дневных барах
  cov_lookback: 60
  min_cov_obs: 30
  alpha_refit_every: 4
  cost_bps: 8.0              # крипто-косты выше
  price_col: close
  periods_per_year: 365      # 24/7

# Число «испытаний» для Deflated Sharpe: сколько вариантов стратегии перебрано
# (3 сигнала × несколько комбинаций оптимизатора). Консервативно.
n_trials: 12
