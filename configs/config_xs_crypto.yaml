# Cross-Sectional CRYPTO preset (Stage B1) — крипто-вертикаль на готовый движок.
# Запуск:  python script_xs_backtest.py --config configs/config_xs_crypto.yaml
# Источник synthetic → работает без данных. Для реальных бесплатных данных:
#   data.source: free, data.vendor: binance  (исторические бары Binance public, без ключей).
#   funding_carry / basis / size требуют колонок funding_rate / basis / mcap (BYO или free-loader).

mode: cross_sectional
asset_class: crypto
btc_symbol: BTC

data:
  source: synthetic          # synthetic | free (binance) | parquet (BYO)
  vendor: binance
  symbols: [BTC, ETH, SOL, BNB, ADA, XRP, DOGE, LINK]
  synthetic_bars: 220
  synthetic_seed: 7
  cache: true                # parquet-кэш баров (защита free rate-limit)
  # Stage D1 — для source: free раскомментируйте, чтобы funding/basis/size «ожили» на бесплатных Binance-данных:
  # enrich: [funding, basis, mcap]   # funding/basis = PIT-true (Binance), mcap = approx (snapshot/BYO history)

universe:
  type: static
  symbols: [BTC, ETH, SOL, BNB, ADA, XRP, DOGE, LINK]

signals:
  - {name: mom_90, kind: crypto_momentum, lookback: 90, skip: 7, transforms: [winsorize, zscore]}
  - {name: mom_30, kind: crypto_momentum, lookback: 30, skip: 1, transforms: [zscore]}
  - {name: reversal_5, kind: reversal, window: 5, transforms: [zscore]}
  # Stage D1: «оживают» на source: free + enrich: [funding, basis, mcap] (или BYO-колонки):
  # - {name: funding_carry, kind: funding_carry, transforms: [zscore]}
  # - {name: basis, kind: basis, transforms: [zscore]}
  # - {name: size, kind: size, transforms: [zscore]}

alpha:
  method: ic_weighted

risk:
  type: crypto_factor        # BTC-beta + size + sector факторная модель (Σ = BFBᵀ+D)
  method: ledoit_wolf

# Крипто-факторы (для risk.type=crypto_factor)
sectors: {BTC: L1, ETH: L1, SOL: L1, BNB: L1, ADA: L1, XRP: Payments, DOGE: Meme, LINK: DeFi}
mcaps:   {BTC: 1300, ETH: 400, SOL: 80, BNB: 90, ADA: 20, XRP: 120, DOGE: 20, LINK: 10}

optimizer:
  objective: mean_variance
  risk_aversion: 5.0
  gross_max: 1.0
  net_target: 0.0            # market-neutral
  long_only: false
  max_position: 0.30

backtest:
  rebalance_every: 7         # weekly на дневных барах
  cov_lookback: 45
  min_cov_obs: 20
  alpha_refit_every: 4
  cost_bps: 8.0              # крипто-косты выше
  price_col: close
  periods_per_year: 365      # 24/7

n_trials: 5
