mode: sim
run_id: test-sim-run
logs_dir: logs
artifacts_dir: artifacts
seasonality_log_level: INFO

asset_class: crypto
data_vendor: binance

execution_profile: MKT_OPEN_NEXT_4H
execution_params:
  slippage_bps: 0.0
  limit_offset_bps: 0.0
  ttl_steps: 0
  tif: GTC
execution:
  mode: bar
  enabled: true
  spot_only: true
  fill_policy: next_open_market
  intrabar_price_model: "bridge"
  timeframe_ms: 14400000
  reference_prices_path: null
  use_latency_from: null
  latency_constant_ms: null
  entry_mode: default
  clip_to_bar:
    enabled: true
    strict_open_fill: false
  bar_capacity_base:
    enabled: false
  bridge:
    intrabar_price_model: "bridge"
    timeframe_ms: 14400000
    reference_prices_path: null
    use_latency_from: null
    latency_constant_ms: null
execution_config:
  notional_threshold: 10000.0
  large_order_algo: TWAP
  pov:
    participation: 0.10
    child_interval_s: 60
    min_child_notional: 20.0

liquidity_seasonality_path: "data/latency/liquidity_latency_seasonality.json"
liquidity_seasonality_hash: null
liquidity_seasonality_override_path: null
latency_seasonality_path: "data/latency/liquidity_latency_seasonality.json"
use_seasonality: true

market: spot

data:
  symbols: ["BTCUSDT"]
  timeframe: "4h"

model:
  algo: "ppo"
  params: {}

quantizer:
  filters_path: "data/binance_filters.json"
  strict_filters: true
  quantize_mode: "inward"
  enforce_percent_price_by_side: true
  auto_refresh_days: 30
  refresh_on_start: false

adv:
  enabled: false

fees:
  path: "data/fees/fees_by_symbol.json"
  rounding:
    enabled: true
    mode: "up"

slippage:
  k: 0.8
  min_half_spread_bps: 0.0
  default_spread_bps: 2.0
  eps: 1e-12
  dynamic:
    enabled: false

latency:
  use_seasonality: true
  latency_seasonality_path: null
  refresh_period_days: 30
  seasonality_default: 1.0
  base_ms: 250
  jitter_ms: 50
  spike_p: 0.01
  spike_mult: 5.0
  timeout_ms: 2500
  retries: 1
  seed: 0
  vol_metric: sigma
  vol_window: 120
  volatility_gamma: 0.0
  zscore_clip: 3.0
  min_ms: 0
  max_ms: 10000
  debug_log: false
  vol_debug_log: false

risk:
  enabled: true
  max_abs_position_qty: 0.0
  max_abs_position_notional: 0.0
  max_order_notional: 0.0
  max_orders_per_min: 60
  max_orders_window_s: 60
  daily_loss_limit: 0.0
  pause_seconds_on_violation: 300
  daily_reset_utc_hour: 0

no_trade:
  enabled: false

components:
  market_data:
    target: impl_offline_data:OfflineCSVBarSource
    params:
      paths: ["data/BTCUSDT.csv"]
      timeframe: "4h"
      ts_col: "ts_ms"
  executor:
    target: impl_sim_executor:SimExecutor
    params:
      symbol: "BTCUSDT"
  feature_pipe:
    target: feature_pipe:FeaturePipe
    params: {}
  policy:
    target: strategies.momentum:MomentumStrategy
    params:
      enter_threshold: 0.0
      exit_threshold: 0.0
  risk_guards:
    target: impl_risk_basic:RiskBasicImpl
    params: {}
  backtest_engine:
    target: service_backtest:ServiceBacktest
    params:
      price_col: "close"
