[importlinter]
root_packages =
    adapters
    adversarial
    api
    ccea
    domain
    lob
    optimizers
    packages
    scripts
    services
    strategies
    utils
    wrappers
include_external_packages = true

# ============================================================================
# CCEA Phase 2: Cloud/Agent/Shared Zone Contracts
# ============================================================================
# These contracts enforce hard separation between zones:
# - Cloud: research/backtest/training/control plane (NO trading code)
# - Agent: secrets/live loop/risk enforce/order creation (HAS trading code)
# - Shared: contracts/models/simulation/data-only adapters (SAFE for both)
# ============================================================================

[importlinter:contract:ccea-cloud-agent-boundary]
name = Cloud cannot import Agent modules
type = forbidden
source_modules =
    packages.cloud
forbidden_modules =
    packages.agent
    adapters.alpaca.order_execution
    adapters.alpaca.options_execution
    adapters.binance.futures_order_execution
    adapters.binance_spot_private
    adapters.oanda.order_execution
    adapters.ib.order_execution
    adapters.ib.options_combo
    execution_providers
    execution_providers_l3
    execution_providers_futures
    execution_providers_futures_l3
    execution_providers_cme
    execution_providers_cme_l3
    service_signal_runner
    script_live
    script_futures_live
    risk_guard

[importlinter:contract:ccea-shared-independence]
name = Shared zone cannot import Cloud or Agent internals
type = forbidden
source_modules =
    packages.shared
forbidden_modules =
    packages.cloud.internal
    packages.agent.vault
    packages.agent.execution
    packages.agent.policy
    packages.agent.reconciliation
    packages.agent.approval

[importlinter:contract:ccea-data-only-adapters]
name = Data-only adapters cannot import trading modules
type = forbidden
source_modules =
    adapters.alpaca.market_data
    adapters.binance.market_data
    adapters.binance.futures_market_data
    adapters.oanda.market_data
    adapters.ib.market_data
    adapters.polygon.market_data
    adapters.yahoo.market_data
forbidden_modules =
    adapters.alpaca.order_execution
    adapters.alpaca.options_execution
    adapters.binance.futures_order_execution
    adapters.binance_spot_private
    adapters.oanda.order_execution
    adapters.ib.order_execution
    adapters.ib.options_combo

[importlinter:contract:ccea-ccea-internal]
name = CCEA guardrails remain zone-agnostic
type = forbidden
source_modules =
    ccea.guardrails
forbidden_modules =
    packages.agent.vault
    packages.agent.execution
    adapters.alpaca.order_execution
    adapters.binance.futures_order_execution

# ============================================================================
# Original Layered Architecture Contract
# ============================================================================

[importlinter:layered_architecture]
name = Enforce layered architecture (core -> impl -> services -> strategies -> scripts)
type = layers
layers =
    scripts
    strategies
    services : api : service_calibrate_slippage
    adapters : adversarial : execution_providers : execution_providers_cme : execution_sim : impl_binance_public : impl_circuit_breaker : impl_cme_rollover : impl_cme_settlement : impl_fees : impl_futures_funding : impl_quantizer : impl_span_margin : lob : optimizers : wrappers
    core_config : core_constants : core_contracts : core_errors : core_futures : core_models : core_options : core_strategy : domain : utils
ignore_imports =
    scripts.* -> scripts.*
    strategies.* -> strategies.*
    services.* -> services.*
    adapters.* -> adapters.*
    adapters.binance_spot_private -> services.retry
    adapters.config -> services.secure_logging
    adapters.binance.futures_order_execution -> services.rest_budget
    wrappers.futures_env -> services.futures_feature_flags
