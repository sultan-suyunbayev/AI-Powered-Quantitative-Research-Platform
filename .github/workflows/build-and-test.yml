name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Build, verify hash, and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install make (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: choco install make --yes

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU, build, dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-cpu.lock.txt
          python -m pip install -r requirements-dev.lock.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Check formatting with black
        run: python -m black --check .

      # ========================================================================
      # CCEA Guardrails (fail-closed enforcement)
      # ========================================================================
      - name: CCEA Schema Check (BT-002)
        env:
          PYTHONUTF8: "1"
        run: python -m ccea.guardrails.schema_check docs/schemas/

      - name: CCEA Protocol Check (PM-002)
        env:
          PYTHONUTF8: "1"
        run: python -m ccea.guardrails.protocol_check --schema docs/schemas/protocol_messages.schema.json

      - name: CCEA Import Boundary Check (BT-001, BT-005)
        env:
          PYTHONUTF8: "1"
        run: python -m ccea.guardrails.import_check --target cloud --directory packages/cloud

      - name: CCEA Intent Prohibition Check
        env:
          PYTHONUTF8: "1"
        run: python -m ccea.guardrails.intent_prohibition --cloud-path packages/cloud

      - name: CCEA Cloud Allowlist Check
        env:
          PYTHONUTF8: "1"
        run: python -m ccea.guardrails.cloud_allowlist --cloud-dir packages/cloud

      - name: CCEA Design Doc SHA Check (WI-TRACE-01)
        env:
          PYTHONUTF8: "1"
        run: python -m ccea.guardrails.design_doc_check

      - name: CCEA Traceability Matrix Check (WI-TRACE-02)
        env:
          PYTHONUTF8: "1"
        run: python -m ccea.guardrails.traceability_check

      - name: Lint imports (soft)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: lint-imports --config importlinter.ini --show-timings

      - name: Lint imports (enforced)
        env:
          PYTHONUTF8: "1"
        run: lint-imports --config importlinter.ini --show-timings

      - name: Detect secrets (soft)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: python -m detect_secrets scan --baseline .secrets.baseline --all-files --json > detect-secrets-scan.json

      - name: Detect secrets (enforced)
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import json, subprocess, sys, pathlib

          cmd = [
              sys.executable,
              "-m",
              "detect_secrets",
              "scan",
              "--baseline",
              ".secrets.baseline",
              "--all-files",
              "--json",
          ]
          result = subprocess.run(cmd, capture_output=True, text=True)
          pathlib.Path("detect-secrets-scan.json").write_text(result.stdout, encoding="utf-8")
          if result.returncode not in (0,):
              sys.stdout.write(result.stdout)
              sys.stderr.write(result.stderr)
              sys.exit(result.returncode)

          baseline = json.loads(pathlib.Path(".secrets.baseline").read_text(encoding="utf-8"))
          scan = json.loads(result.stdout or "{}")
          baseline_hashes = {
              fname: {finding["hashed_secret"] for finding in findings}
              for fname, findings in baseline.get("results", {}).items()
          }
          new = []
          for fname, findings in scan.get("results", {}).items():
              allowed = baseline_hashes.get(fname, set())
              for finding in findings:
                  if finding.get("hashed_secret") not in allowed:
                      new.append(f"{fname}:{finding.get('line_number')} ({finding.get('type')})")

          if new:
              print("New potential secrets detected (not in baseline):")
              for item in new:
                  print(f"- {item}")
              sys.exit(1)
          PY

      - name: Enforce generated-file policy before build
        run: python tools/clean_artifacts.py --check-only

      - name: Build
        run: make build

      - name: Verify build hash report
        run: make verify-hash

      # ========================================================================
      # Phase 9 (P1): zone-separated artifacts + post-build cloud artifact scan
      # ========================================================================
      - name: Build Cloud/Agent distributions (WI-BUILD-01)
        env:
          PYTHONUTF8: "1"
        run: make dist-all

      - name: Verify Cloud artifact contents (WI-BUILD-01)
        env:
          PYTHONUTF8: "1"
        run: make artifact-check-cloud

      - name: Run test suite
        run: make test

      # ========================================================================
      # Test Skip Count Tracking (Tech Debt: testing-skipif-tracking)
      # ========================================================================
      - name: Track skipped tests
        if: always()
        env:
          PYTHONUTF8: "1"
        run: |
          echo "=== Skipped Tests Report ==="
          echo "Tracking testing-skipif-tracking tech debt item"
          echo ""
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          # Run pytest with --collect-only to get skip info
          result = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", "--ignore=sandbox", "tests/"],
              capture_output=True,
              text=True,
              timeout=300
          )

          # Count skipif markers in test files
          skip_count = 0
          skip_files = {}
          for test_file in Path("tests").rglob("*.py"):
              try:
                  content = test_file.read_text(encoding="utf-8", errors="ignore")
                  file_skips = content.count("@pytest.mark.skip")
                  file_skips += content.count("pytest.importorskip")
                  if file_skips > 0:
                      skip_files[str(test_file)] = file_skips
                      skip_count += file_skips
              except Exception:
                  pass

          report = {
              "total_skip_markers": skip_count,
              "files_with_skips": len(skip_files),
              "top_files": dict(sorted(skip_files.items(), key=lambda x: -x[1])[:10])
          }

          Path("skip-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")

          print(f"Total skip markers found: {skip_count}")
          print(f"Files with skip markers: {len(skip_files)}")
          print("")
          print("Top 10 files by skip count:")
          for fname, count in list(report["top_files"].items())[:10]:
              print(f"  {fname}: {count} skips")

          # Threshold check (warn if > 100 skips)
          if skip_count > 100:
              print(f"\nWARNING: High skip count ({skip_count} > 100 threshold)")
              print("Review if all skips are intentional and tracked")
          PY

      - name: Upload skip report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skip-report-${{ matrix.os }}
          path: skip-report.json
          retention-days: 30
          if-no-files-found: ignore

      # ========================================================================
      # Cyclomatic Complexity Tracking (Tech Debt: arch-train-monolith)
      # ========================================================================
      - name: Install radon
        run: python -m pip install radon

      - name: Cyclomatic Complexity Report
        run: |
          echo "=== Cyclomatic Complexity Report ==="
          echo "Tracking arch-train-monolith tech debt item"
          echo ""
          echo "--- distributional_ppo.py Summary ---"
          python -m radon cc distributional_ppo.py -a -s --json > complexity-report.json
          python -m radon cc distributional_ppo.py -a -s
          echo ""
          echo "--- High Complexity Functions (CC > 20) ---"
          python - <<'PY'
          import json
          import sys
          try:
              data = json.load(open("complexity-report.json", "r", encoding="utf-8"))
              high_cc = []
              for filename, items in data.items():
                  for item in items:
                      cc = item.get("complexity", 0)
                      if cc > 20:
                          high_cc.append({
                              "name": item.get("name"),
                              "type": item.get("type"),
                              "complexity": cc,
                              "lineno": item.get("lineno")
                          })
              if high_cc:
                  print(f"Found {len(high_cc)} functions with complexity > 20:")
                  for item in sorted(high_cc, key=lambda x: -x["complexity"]):
                      print(f"  {item['name']} (line {item['lineno']}): CC={item['complexity']}")
              else:
                  print("No functions with complexity > 20 found")
          except Exception as e:
              print(f"Analysis error: {e}")
              sys.exit(0)  # Don't fail build on analysis errors
          PY

      - name: Upload complexity report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complexity-report-${{ matrix.os }}
          path: complexity-report.json
          retention-days: 30
          if-no-files-found: ignore

      # ========================================================================
      # Lockfile Freshness Check (Tech Debt: build-lockfile-freshness)
      # ========================================================================
      - name: Check lockfile freshness
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=== Lockfile Freshness Report ==="
          echo "Tech Debt: build-lockfile-freshness"
          echo ""
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path

          LOCKFILES = [
              "requirements-cpu.lock.txt",
              "requirements-gpu.lock.txt",
              "requirements-dev.lock.txt",
          ]
          REQUIREMENTS = [
              "requirements.txt",
              "requirements-dev.txt",
              "requirements-build.txt",
          ]
          MAX_AGE_DAYS = 90  # Warn if lockfile older than 90 days
          report = {"lockfiles": [], "warnings": [], "status": "OK"}

          for lockfile in LOCKFILES:
              path = Path(lockfile)
              if not path.exists():
                  report["warnings"].append(f"{lockfile}: NOT FOUND")
                  continue

              # Check for Generated header with date
              content = path.read_text(encoding="utf-8", errors="ignore")
              generated_date = None
              for line in content.split("\n")[:10]:
                  if "Generated" in line or "generated" in line:
                      # Try to extract date
                      import re
                      match = re.search(r"(\d{4}-\d{2}-\d{2})", line)
                      if match:
                          generated_date = match.group(1)
                          break

              lock_stat = path.stat()
              lock_mtime = datetime.fromtimestamp(lock_stat.st_mtime)
              age_days = (datetime.now() - lock_mtime).days

              entry = {
                  "file": lockfile,
                  "mtime": lock_mtime.isoformat(),
                  "age_days": age_days,
                  "generated_date": generated_date,
              }
              report["lockfiles"].append(entry)

              if age_days > MAX_AGE_DAYS:
                  report["warnings"].append(
                      f"{lockfile}: {age_days} days old (threshold: {MAX_AGE_DAYS})"
                  )

          # Check if requirements are newer than lockfiles
          for req in REQUIREMENTS:
              req_path = Path(req)
              if not req_path.exists():
                  continue
              req_mtime = datetime.fromtimestamp(req_path.stat().st_mtime)
              for lock_entry in report["lockfiles"]:
                  lock_mtime = datetime.fromisoformat(lock_entry["mtime"])
                  if req_mtime > lock_mtime:
                      report["warnings"].append(
                          f"{req} is newer than {lock_entry['file']} - regenerate lockfile"
                      )

          if report["warnings"]:
              report["status"] = "WARN"

          Path("lockfile-freshness.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8"
          )

          print(f"Status: {report['status']}")
          for entry in report["lockfiles"]:
              print(f"  {entry['file']}: {entry['age_days']} days old")
              if entry.get("generated_date"):
                  print(f"    Generated: {entry['generated_date']}")
          if report["warnings"]:
              print("\nWarnings:")
              for w in report["warnings"]:
                  print(f"  - {w}")
          PY

      - name: Upload lockfile freshness report
        uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: lockfile-freshness
          path: lockfile-freshness.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean artifacts
        run: make clean

      - name: Ensure worktree is clean after clean
        run: |
          make check-clean
          python -c "import subprocess, sys; s=subprocess.check_output(['git','status','--porcelain']).decode().strip(); print(s) if s else None; sys.exit(1 if s else 0)"
