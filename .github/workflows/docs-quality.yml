name: Documentation Quality Checks

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.md'
      - '**.yaml'
      - '**.yml'
      - '.github/workflows/docs-quality.yml'
      - 'tools/check_encoding.py'
      - 'tools/normalize_encoding.py'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.md'
      - '**.yaml'
      - '**.yml'

jobs:
  encoding-check:
    name: Check Encoding (UTF-8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check file encoding
        run: |
          python tools/check_encoding.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Comment on PR (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Encoding check failed**\n\nFound problematic Unicode characters in markdown/YAML files.\n\nTo fix:\n```bash\npython tools/normalize_encoding.py\n```\n\nSee [job logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run markdownlint
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_files: |
            node_modules/
            .git/
            __pycache__/
            venv/

  markdown-links:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check relative links resolve
        run: python tools/check_markdown_links.py

  markdown-render-check:
    name: Markdown Render Check (Pandoc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Check key markdown files render correctly
        run: |
          echo "Checking markdown files with pandoc..."
          for file in README.md ARCHITECTURE.md docs/PLATFORM_REFERENCE.md BUILD_INSTRUCTIONS.md DOCS_INDEX.md; do
            if [ -f "$file" ]; then
              echo "Testing: $file"
              pandoc "$file" -t html -o /dev/null || {
                echo "ERROR: $file failed to render"
                exit 1
              }
              echo "OK: $file"
            fi
          done
          echo "All key markdown files render successfully!"

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -d '{extends: default, rules: {line-length: {max: 120}, document-start: disable}}' configs/ .github/

  tech-debt-registry-sync:
    name: Tech Debt Registry Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check tech debt markers match registry
        run: |
          set -euo pipefail
          echo "Checking tech debt code markers against registry..."

          # Find all # Tech Debt: markers in Python files
          code_markers=$(grep -rn "# Tech Debt:.*TECH_DEBT_REGISTRY" --include="*.py" . 2>/dev/null || true)

          # Find all registry IDs
          if [ -f "docs/reports/TECH_DEBT_REGISTRY.md" ]; then
            registry_ids=$(grep -oP '(?<={#)[a-zA-Z0-9_-]+(?=})' docs/reports/TECH_DEBT_REGISTRY.md || true)
          else
            echo "WARNING: TECH_DEBT_REGISTRY.md not found"
            exit 0
          fi

          # Check that registry has required sections
          required_sections="Architecture Data/ML Testing/Quality Reliability/Operations Security"
          missing_sections=""
          for section in $required_sections; do
            if ! grep -q "^## $section" docs/reports/TECH_DEBT_REGISTRY.md; then
              missing_sections="$missing_sections $section"
            fi
          done

          if [ -n "$missing_sections" ]; then
            echo "WARNING: Missing registry sections:$missing_sections"
          fi

          # Verify registry has at least one controlled item
          controlled_count=$(grep -c "Controlled" docs/reports/TECH_DEBT_REGISTRY.md || echo 0)
          echo "Found $controlled_count controlled tech debt items in registry"

          if [ "$controlled_count" -eq 0 ]; then
            echo "WARNING: No controlled items found in registry"
          fi

          echo "Tech debt registry sync check complete"

  summary:
    name: Quality Summary
    needs: [encoding-check, markdown-lint, markdown-links, markdown-render-check, yaml-lint, tech-debt-registry-sync]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Documentation Quality Check Summary:"
          echo "  - Encoding Check: ${{ needs.encoding-check.result }}"
          echo "  - Markdown Lint: ${{ needs.markdown-lint.result }}"
          echo "  - Markdown Links: ${{ needs.markdown-links.result }}"
          echo "  - Render Check: ${{ needs.markdown-render-check.result }}"
          echo "  - YAML Lint: ${{ needs.yaml-lint.result }}"
          echo "  - Tech Debt Registry: ${{ needs.tech-debt-registry-sync.result }}"

          if [ "${{ needs.encoding-check.result }}" != "success" ] || \
             [ "${{ needs.markdown-lint.result }}" != "success" ] || \
             [ "${{ needs.markdown-links.result }}" != "success" ] || \
             [ "${{ needs.markdown-render-check.result }}" != "success" ] || \
             [ "${{ needs.yaml-lint.result }}" != "success" ] || \
             [ "${{ needs.tech-debt-registry-sync.result }}" != "success" ]; then
            echo "Some quality checks failed"
            exit 1
          fi

          echo "All quality checks passed!"
